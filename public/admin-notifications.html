<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Notificações - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0 0 8px;
            color: #1a202c;
            font-size: 28px;
        }

        .subtitle {
            color: #718096;
            margin: 0 0 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background: #c6f6d5;
            color: #2f855a;
            border-left: 4px solid #38a169;
        }

        .status.error {
            background: #fed7d7;
            color: #c53030;
            border-left: 4px solid #e53e3e;
        }

        .status.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .templates {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .template-btn {
            padding: 12px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .template-btn:hover {
            border-color: #667eea;
            background: #edf2f7;
        }

        .template-btn strong {
            display: block;
            margin-bottom: 4px;
            color: #2d3748;
        }

        .template-btn span {
            color: #718096;
            font-size: 13px;
        }

        .info-box {
            background: #ebf8ff;
            border-left: 4px solid #3182ce;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
            color: #2c5282;
        }

        .info-box p {
            margin: 0;
            color: #2c5282;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📢 Painel de Notificações</h1>
        <p class="subtitle">Envie notificações para os usuários do app</p>

        <div class="info-box">
            <strong>ℹ️ Como funciona?</strong>
            <p>As notificações serão enviadas apenas para usuários que permitiram receber notificações. Esta página usa a API local do navegador para fins de teste.</p>
        </div>

        <div class="templates">
            <button class="template-btn" onclick="useTemplate('nova-musica')">
                <strong>🎵 Nova Música</strong>
                <span>Anuncia uma nova música adicionada</span>
            </button>
            <button class="template-btn" onclick="useTemplate('evento')">
                <strong>📅 Próximo Evento</strong>
                <span>Lembra sobre um evento próximo</span>
            </button>
            <button class="template-btn" onclick="useTemplate('aviso')">
                <strong>⚠️ Aviso Geral</strong>
                <span>Mensagem importante para todos</span>
            </button>
        </div>

        <form id="notificationForm">
            <div class="form-group">
                <label for="title">Título da Notificação *</label>
                <input type="text" id="title" placeholder="Ex: Nova música disponível!" required>
            </div>

            <div class="form-group">
                <label for="body">Mensagem *</label>
                <textarea id="body" placeholder="Ex: Confira 'Grande é o Senhor' na programação de hoje" required></textarea>
            </div>

            <div class="form-group">
                <label for="icon">Ícone (emoji ou URL)</label>
                <input type="text" id="icon" placeholder="🎵 ou /icon.png">
            </div>

            <button type="submit" class="btn">Enviar Notificação</button>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script type="module">
        import { NotificationManager } from './js/notifications.js';

        const form = document.getElementById('notificationForm');
        const statusEl = document.getElementById('status');

        // Templates pré-definidos
        window.useTemplate = (type) => {
            const templates = {
                'nova-musica': {
                    title: '🎵 Nova Música Disponível!',
                    body: 'Uma nova música foi adicionada à programação. Confira agora!',
                    icon: '🎵'
                },
                'evento': {
                    title: '📅 Evento Começando em Breve',
                    body: 'O culto começa em 30 minutos. Não perca!',
                    icon: '⏰'
                },
                'aviso': {
                    title: '⚠️ Aviso Importante',
                    body: 'Temos uma atualização importante para você.',
                    icon: '📢'
                }
            };

            const template = templates[type];
            if (template) {
                document.getElementById('title').value = template.title;
                document.getElementById('body').value = template.body;
                document.getElementById('icon').value = template.icon;
            }
        };

        // Envio do formulário
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const body = document.getElementById('body').value;
            const icon = document.getElementById('icon').value;

            // Verifica permissão
            if (NotificationManager.getPermissionStatus() !== 'granted') {
                showStatus('error', 'Você precisa permitir notificações primeiro!');
                const granted = await NotificationManager.requestPermission();
                if (!granted) return;
            }

            // Envia notificação
            try {
                await NotificationManager.send(title, {
                    body: body,
                    icon: icon || undefined
                });
                
                showStatus('success', '✅ Notificação enviada com sucesso!');
                form.reset();
            } catch (error) {
                showStatus('error', '❌ Erro ao enviar: ' + error.message);
            }
        });

        function showStatus(type, message) {
            statusEl.textContent = message;
            statusEl.className = `status ${type} show`;
            setTimeout(() => {
                statusEl.classList.remove('show');
            }, 5000);
        }

        // Verifica suporte ao carregar
        if (!NotificationManager.isSupported()) {
            showStatus('error', '❌ Seu navegador não suporta notificações');
        }
    </script>
</body>
</html>
